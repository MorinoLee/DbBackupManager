name: 文档检查

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文档检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查 Markdown 链接与编码
        shell: pwsh
        run: ./scripts/ci/Check-Docs.ps1
